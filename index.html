<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life List</title>
<meta name="description" content="A shared bucket list.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#EFEDE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life List">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    --bg: #EFEDE5;
    --surface: #FBFAF6;
    --surface-2: #F3F1E8;
    --text: #232620;
    --text-muted: #6E7266;
    --border: #DEDACC;
    --accent: #1F4B4A;
    --accent-contrast: #FFFFFF;
    --gold: #B8823A;
    --gold-soft: #F1E3C6;
    --gold-contrast: #2B1E06;
    --danger: #A8432E;
    --danger-soft: #F3DCD3;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181A;
      --surface: #182022;
      --surface-2: #1E2729;
      --text: #EAE7DD;
      --text-muted: #9BA199;
      --border: #2A3436;
      --accent: #7BC2B8;
      --accent-contrast: #0D1414;
      --gold: #E3B36B;
      --gold-soft: #2E2718;
      --gold-contrast: #1D1506;
      --danger: #E08872;
      --danger-soft: #3A2420;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12181A;
    --surface: #182022;
    --surface-2: #1E2729;
    --text: #EAE7DD;
    --text-muted: #9BA199;
    --border: #2A3436;
    --accent: #7BC2B8;
    --accent-contrast: #0D1414;
    --gold: #E3B36B;
    --gold-soft: #2E2718;
    --gold-contrast: #1D1506;
    --danger: #E08872;
    --danger-soft: #3A2420;
    color-scheme: dark;
  }

  * , *::before, *::after { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .page {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  .head {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding-top: 4px;
    padding-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .brand h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.75rem;
    margin: 0;
    color: var(--text);
    text-wrap: balance;
  }

  .stat {
    margin: 4px 0 0;
    font-size: 0.8125rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .edit-btn {
    flex-shrink: 0;
    height: 36px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .edit-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    height: 44px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    padding: 0 14px 0 40px;
    -webkit-appearance: none;
    appearance: none;
  }
  #searchInput::placeholder { color: var(--text-muted); }
  #searchInput:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .add-form { display: flex; gap: 8px; }
  #addInput {
    flex: 1;
    min-width: 0;
    height: 48px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    padding: 0 14px;
  }
  #addInput::placeholder { color: var(--text-muted); }
  #addInput:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .add-btn {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .1s ease;
  }
  .add-btn svg { width: 22px; height: 22px; }
  .add-btn:active { transform: scale(.94); }

  .section + .section { margin-top: 22px; }
  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 8px 6px;
  }

  .rows {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .row {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
    padding: 0 8px 0 12px;
  }
  .row:last-child { border-bottom: none; }
  .row.is-done { background: var(--surface-2); }

  .row-top {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .row-main {
    all: unset;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    padding: 12px 4px;
    cursor: pointer;
    box-sizing: border-box;
    font-family: var(--font-body);
    font-size: 1rem;
    text-align: left;
  }
  .row-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }

  .row-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .check svg {
    width: 13px;
    height: 13px;
    color: var(--gold-contrast);
    opacity: 0;
    transform: scale(.6);
    transition: opacity .15s ease, transform .15s ease;
  }
  .check.is-done { background: var(--gold); border-color: var(--gold); }
  .check.is-done svg { opacity: 1; transform: scale(1); }

  .row-text {
    min-width: 0;
    color: var(--text);
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .row.is-done .row-text {
    color: var(--text-muted);
  }

  .row-caption {
    font-size: 0.8125rem;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }

  .note-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .note-btn svg { width: 15px; height: 15px; }
  .note-btn:hover { background: var(--surface-2); color: var(--accent); }
  .note-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .note-editor { padding: 0 4px 12px 40px; }
  .note-input {
    width: 100%;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.875rem;
    padding: 0 12px;
  }
  .note-input::placeholder { color: var(--text-muted); }
  .note-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .delete-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--danger-soft);
    color: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .delete-btn svg { width: 15px; height: 15px; }
  .delete-btn:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

  .state {
    text-align: center;
    padding: 52px 20px;
    color: var(--text-muted);
  }
  .state-icon { color: var(--text-muted); margin-bottom: 14px; display: flex; justify-content: center; }
  .state h3 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.125rem;
    color: var(--text);
    margin: 0 0 6px;
  }
  .state p { margin: 0; font-size: 0.9375rem; line-height: 1.5; }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.9375rem;
    cursor: pointer;
    padding: 10px 12px;
    margin-top: 6px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: var(--text);
    color: var(--bg);
    border-radius: 12px;
    padding: 10px 8px 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    z-index: 20;
  }
  .toast[hidden] { display: none; }
  .toast-msg { overflow-wrap: anywhere; }
  .toast-undo {
    background: none;
    border: none;
    color: var(--gold);
    font-weight: 800;
    font-size: 0.875rem;
    cursor: pointer;
    padding: 8px 10px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  @media (max-width: 360px) {
    .brand h1 { font-size: 1.5rem; }
  }

  .auth-page {
    max-width: 380px;
    margin: 0 auto;
    padding: 64px 20px;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .auth-page h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 2rem;
    margin: 0 0 4px;
    color: var(--text);
  }
  .auth-sub { margin: 0 0 28px; color: var(--text-muted); font-size: 0.9375rem; }
  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .auth-field {
    height: 48px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    padding: 0 14px;
    width: 100%;
  }
  .auth-field::placeholder { color: var(--text-muted); }
  .auth-field:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .auth-submit {
    height: 48px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .auth-error {
    color: var(--danger);
    font-size: 0.875rem;
    margin: 0;
    min-height: 1.2em;
  }
  .auth-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.9375rem;
    cursor: pointer;
    padding: 14px 0 0;
    text-align: left;
  }
  .auth-page[hidden], .app-page[hidden] { display: none; }

  .head-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn svg { width: 17px; height: 17px; }

  .list-switch {
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0 12px;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .list-switch[hidden] { display: none; }

  .banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--gold-soft);
    color: var(--gold-contrast);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 0.875rem;
  }
  .banner[hidden] { display: none; }
  .banner-btn {
    border: none;
    background: var(--gold);
    color: var(--gold-contrast);
    font-weight: 700;
    font-size: 0.8125rem;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .banner-dismiss {
    border: none;
    background: none;
    color: var(--gold-contrast);
    font-weight: 700;
    font-size: 0.8125rem;
    cursor: pointer;
    padding: 4px;
  }

  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }
  .sheet-overlay[hidden] { display: none; }
  .sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px 28px;
    width: 100%;
    max-width: 520px;
    box-sizing: border-box;
  }
  .sheet h2 {
    font-family: var(--font-display);
    font-size: 1.25rem;
    margin: 0 0 16px;
    color: var(--text);
  }
  .sheet-section { margin-bottom: 18px; }
  .sheet-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 8px;
  }
  .code-row { display: flex; gap: 8px; }
  .code-box {
    flex: 1;
    min-width: 0;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.875rem;
    padding: 0 12px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .sheet-btn {
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 700;
    font-size: 0.875rem;
    padding: 0 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sheet-btn.secondary {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
  }
  .sheet-btn.danger {
    background: transparent;
    border: 1.5px solid var(--danger);
    color: var(--danger);
  }
  .sheet-close {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    margin-top: 4px;
  }
</style>

<div class="auth-page" id="authPage">
  <h1>Life List</h1>
  <p class="auth-sub" id="authSub">Sign in to your list.</p>
  <form class="auth-form" id="authForm">
    <input type="text" id="authName" class="auth-field" placeholder="Your name" autocomplete="name" hidden>
    <input type="email" id="authEmail" class="auth-field" placeholder="Email" autocomplete="email" required>
    <input type="password" id="authPassword" class="auth-field" placeholder="Password" autocomplete="current-password" required minlength="6">
    <p class="auth-error" id="authError"></p>
    <button type="submit" class="auth-submit" id="authSubmitBtn">Log in</button>
  </form>
  <button type="button" class="auth-toggle" id="authToggleBtn">Need an account? Sign up</button>
</div>

<div class="app-page" id="appPage" hidden>
  <div class="page">
    <header class="head">
      <div class="head-row">
        <div class="brand">
          <h1>Life List</h1>
          <p class="stat" id="statLine">Loading your list&hellip;</p>
        </div>
        <div class="head-actions">
          <button type="button" class="edit-btn" id="editBtn" aria-pressed="false" hidden>Edit</button>
          <button type="button" class="icon-btn" id="shareOpenBtn" aria-label="Sharing and account">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <select class="list-switch" id="listSwitch" hidden aria-label="Choose list"></select>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="Search your wishes&hellip;" aria-label="Search wishes" autocomplete="off">
      </div>

      <form class="add-form" id="addForm">
        <input type="text" id="addInput" placeholder="e.g. Watch the sunrise from a mountain" aria-label="New wish" maxlength="200" autocomplete="off">
        <button type="submit" class="add-btn" aria-label="Add wish">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </form>
    </header>

    <div class="banner" id="importBanner" hidden>
      <span>We found your old shared list.</span>
      <span style="display:flex; gap:6px;">
        <button type="button" class="banner-btn" id="importBtn">Import it</button>
        <button type="button" class="banner-dismiss" id="importDismissBtn">Dismiss</button>
      </span>
    </div>

    <main id="listWrap"></main>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="sheet-overlay" id="shareOverlay" hidden>
  <div class="sheet">
    <h2>Sharing &amp; account</h2>

    <div class="sheet-section">
      <p class="sheet-label">Your invite code</p>
      <div class="code-row">
        <div class="code-box" id="myCodeBox"></div>
        <button type="button" class="sheet-btn secondary" id="copyCodeBtn">Copy</button>
      </div>
    </div>

    <div class="sheet-section">
      <p class="sheet-label">Join someone's list</p>
      <div class="code-row">
        <input type="text" class="code-box" id="joinCodeInput" placeholder="Paste their invite code" autocomplete="off">
        <button type="button" class="sheet-btn" id="joinBtn">Join</button>
      </div>
      <p class="auth-error" id="joinError"></p>
    </div>

    <div class="sheet-section">
      <button type="button" class="sheet-btn danger" id="signOutBtn" style="width:100%;">Sign out</button>
    </div>

    <button type="button" class="sheet-close" id="shareCloseBtn">Close</button>
  </div>
</div>

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var DELETE_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var EMPTY_SVG = '<svg viewBox="0 0 64 64" fill="none" width="56" height="56" aria-hidden="true"><circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M32 21v22M21 32h22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
  var NOTE_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4L18 10a2.5 2.5 0 00-4-4L4 16v4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 7l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function formatDate(ts) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return ''; }
  }

  var AUTH_ERROR_MESSAGES = {
    'auth/email-already-in-use': 'That email already has an account — try logging in.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password needs at least 6 characters.',
    'auth/wrong-password': 'Wrong password.',
    'auth/invalid-credential': 'Wrong email or password.',
    'auth/user-not-found': 'No account with that email — try signing up.',
    'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
    'auth/network-request-failed': 'Network error — check your connection.',
    'auth/operation-not-allowed': 'Sign-in isn’t turned on yet for this app.'
  };

  var LOCAL_KEY = 'life-list.wishes.v1';

  var els = {
    authPage: document.getElementById('authPage'),
    authSub: document.getElementById('authSub'),
    authForm: document.getElementById('authForm'),
    authName: document.getElementById('authName'),
    authEmail: document.getElementById('authEmail'),
    authPassword: document.getElementById('authPassword'),
    authError: document.getElementById('authError'),
    authSubmitBtn: document.getElementById('authSubmitBtn'),
    authToggleBtn: document.getElementById('authToggleBtn'),

    appPage: document.getElementById('appPage'),
    statLine: document.getElementById('statLine'),
    editBtn: document.getElementById('editBtn'),
    shareOpenBtn: document.getElementById('shareOpenBtn'),
    listSwitch: document.getElementById('listSwitch'),
    searchInput: document.getElementById('searchInput'),
    addForm: document.getElementById('addForm'),
    addInput: document.getElementById('addInput'),
    listWrap: document.getElementById('listWrap'),
    toast: document.getElementById('toast'),

    importBanner: document.getElementById('importBanner'),
    importBtn: document.getElementById('importBtn'),
    importDismissBtn: document.getElementById('importDismissBtn'),

    shareOverlay: document.getElementById('shareOverlay'),
    shareCloseBtn: document.getElementById('shareCloseBtn'),
    myCodeBox: document.getElementById('myCodeBox'),
    copyCodeBtn: document.getElementById('copyCodeBtn'),
    joinCodeInput: document.getElementById('joinCodeInput'),
    joinBtn: document.getElementById('joinBtn'),
    joinError: document.getElementById('joinError'),
    signOutBtn: document.getElementById('signOutBtn')
  };

  var items = [];
  var loaded = false;
  var editMode = false;
  var editingNoteId = null;
  var search = '';
  var mode = null;
  var firebaseDb = null;
  var firebaseAuth = null;
  var wishesRef = null;
  var wishesUnsub = null;
  var toastTimer = null;

  var authIsSignup = false;
  var currentUid = null;
  var activeListId = null;
  var sharedListIds = [];
  var listNameCache = {};
  var legacyImportChecked = false;
  var legacyWishesCache = null;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }

  function localLoad() {
    try {
      var raw = JSON.parse(localStorage.getItem(LOCAL_KEY));
      return Array.isArray(raw) ? raw : [];
    } catch (e) { return []; }
  }
  function localSave() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch (e) {}
  }

  function hideToast() {
    els.toast.hidden = true;
  }
  function showMessage(text) {
    clearTimeout(toastTimer);
    els.toast.innerHTML = '';
    els.toast.appendChild(el('span', 'toast-msg', text));
    els.toast.hidden = false;
    toastTimer = setTimeout(hideToast, 3000);
  }
  function showUndoToast(item) {
    clearTimeout(toastTimer);
    els.toast.innerHTML = '';
    els.toast.appendChild(el('span', 'toast-msg', 'Removed “' + item.text + '”'));
    var undoBtn = el('button', 'toast-undo', 'Undo');
    undoBtn.type = 'button';
    undoBtn.addEventListener('click', function () {
      restoreWish(item);
      hideToast();
    });
    els.toast.appendChild(undoBtn);
    els.toast.hidden = false;
    toastTimer = setTimeout(hideToast, 5000);
  }

  function addWish(rawText) {
    var text = rawText.trim();
    if (!text) return;
    if (mode === 'firebase') {
      push(wishesRef, { text: text, done: false, createdAt: Date.now(), doneAt: null })
        .catch(function () { showMessage('Could not add that wish — try again'); });
    } else {
      items.unshift({ id: genId(), text: text, done: false, createdAt: Date.now(), doneAt: null });
      localSave();
      render();
    }
  }

  function toggleDone(item) {
    var done = !item.done;
    if (mode === 'firebase') {
      update(ref(firebaseDb, 'lists/' + activeListId + '/wishes/' + item.id), { done: done, doneAt: done ? Date.now() : null })
        .catch(function () { showMessage('Could not update — try again'); });
    } else {
      item.done = done;
      item.doneAt = done ? Date.now() : null;
      localSave();
      render();
    }
  }

  function saveNote(item, rawText) {
    var note = rawText.trim();
    if (mode === 'firebase') {
      update(ref(firebaseDb, 'lists/' + activeListId + '/wishes/' + item.id), { note: note || null })
        .catch(function () { showMessage('Could not save note — try again'); });
    } else {
      item.note = note || null;
      localSave();
      render();
    }
  }

  function deleteWish(item) {
    if (mode === 'firebase') {
      remove(ref(firebaseDb, 'lists/' + activeListId + '/wishes/' + item.id))
        .then(function () { showUndoToast(item); })
        .catch(function () { showMessage('Could not delete — try again'); });
    } else {
      items = items.filter(function (w) { return w.id !== item.id; });
      localSave();
      render();
      showUndoToast(item);
    }
  }

  function restoreWish(item) {
    if (mode === 'firebase') {
      push(wishesRef, { text: item.text, done: item.done, createdAt: item.createdAt || Date.now(), doneAt: item.doneAt || null, note: item.note || null })
        .catch(function () { showMessage('Could not restore — try again'); });
    } else {
      items.unshift({ id: genId(), text: item.text, done: item.done, createdAt: item.createdAt || Date.now(), doneAt: item.doneAt || null, note: item.note || null });
      localSave();
      render();
    }
  }

  function buildRow(item) {
    var row = document.createElement('div');
    row.className = 'row' + (item.done ? ' is-done' : '');
    row.dataset.id = item.id;

    var top = document.createElement('div');
    top.className = 'row-top';

    var main = document.createElement('button');
    main.type = 'button';
    main.className = 'row-main';
    main.dataset.action = 'toggle';
    main.setAttribute('aria-pressed', String(!!item.done));
    main.setAttribute('aria-label', (item.done ? 'Mark as not done: ' : 'Mark as done: ') + item.text);

    var check = document.createElement('span');
    check.className = 'check' + (item.done ? ' is-done' : '');
    check.innerHTML = CHECK_SVG;

    var body = el('span', 'row-body');
    body.appendChild(el('span', 'row-text', item.text));

    if (item.done) {
      var caption = formatDate(item.doneAt);
      if (item.note) caption = caption ? (caption + ' · ' + item.note) : item.note;
      if (caption) body.appendChild(el('span', 'row-caption', caption));
    }

    main.appendChild(check);
    main.appendChild(body);
    top.appendChild(main);

    if (item.done) {
      var noteBtn = document.createElement('button');
      noteBtn.type = 'button';
      noteBtn.className = 'note-btn';
      noteBtn.dataset.action = 'note';
      noteBtn.setAttribute('aria-label', (item.note ? 'Edit note: ' : 'Add note: ') + item.text);
      noteBtn.innerHTML = NOTE_SVG;
      top.appendChild(noteBtn);
    }

    if (editMode) {
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-btn';
      del.dataset.action = 'delete';
      del.setAttribute('aria-label', 'Delete: ' + item.text);
      del.innerHTML = DELETE_SVG;
      top.appendChild(del);
    }

    row.appendChild(top);

    if (editingNoteId === item.id) {
      var editor = document.createElement('div');
      editor.className = 'note-editor';
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'note-input';
      input.placeholder = 'Add a note…';
      input.maxLength = 200;
      input.value = item.note || '';
      input.setAttribute('aria-label', 'Note for: ' + item.text);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          editingNoteId = null;
          saveNote(item, input.value);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          editingNoteId = null;
          render();
        }
      });
      input.addEventListener('blur', function () {
        if (editingNoteId === item.id) {
          editingNoteId = null;
          saveNote(item, input.value);
        }
      });
      editor.appendChild(input);
      row.appendChild(editor);
      setTimeout(function () { input.focus(); }, 0);
    }

    return row;
  }

  function buildSection(title, list) {
    var section = document.createElement('section');
    section.className = 'section';
    section.appendChild(el('h2', 'section-title', title + ' · ' + list.length));
    var rows = el('div', 'rows');
    list.forEach(function (item) { rows.appendChild(buildRow(item)); });
    section.appendChild(rows);
    return section;
  }

  function renderLoading() {
    els.listWrap.innerHTML = '';
    var wrap = el('div', 'state');
    wrap.appendChild(el('p', null, 'Fetching your wishes…'));
    els.listWrap.appendChild(wrap);
  }

  function renderEmptyAll() {
    els.listWrap.innerHTML = '';
    var wrap = el('div', 'state');
    var icon = el('div', 'state-icon');
    icon.innerHTML = EMPTY_SVG;
    wrap.appendChild(icon);
    wrap.appendChild(el('h3', null, 'Your life list is empty'));
    wrap.appendChild(el('p', null, 'Add the first thing you want to do, see, or become.'));
    els.listWrap.appendChild(wrap);
  }

  function renderEmptySearch(query) {
    els.listWrap.innerHTML = '';
    var wrap = el('div', 'state');
    wrap.appendChild(el('h3', null, 'No matches'));
    wrap.appendChild(el('p', null, 'Nothing in your list matches “' + query + '”.'));
    var clearBtn = el('button', 'link-btn', 'Clear search');
    clearBtn.type = 'button';
    clearBtn.addEventListener('click', function () {
      search = '';
      els.searchInput.value = '';
      render();
      els.searchInput.focus();
    });
    wrap.appendChild(clearBtn);
    els.listWrap.appendChild(wrap);
  }

  function render() {
    if (items.length === 0) editMode = false;

    var totalActive = items.filter(function (w) { return !w.done; }).length;
    var totalDone = items.filter(function (w) { return w.done; }).length;

    var statText = items.length
      ? (totalActive + (totalActive === 1 ? ' wish' : ' wishes') + ' · ' + totalDone + ' achieved')
      : 'Start your list below';
    if (loaded && mode === 'local') statText += ' · saved on this device';
    els.statLine.textContent = loaded ? statText : 'Loading your list…';

    els.editBtn.hidden = items.length === 0;
    els.editBtn.textContent = editMode ? 'Done' : 'Edit';
    els.editBtn.setAttribute('aria-pressed', String(editMode));

    if (!loaded) { renderLoading(); return; }
    if (items.length === 0) { renderEmptyAll(); return; }

    var q = search.trim().toLowerCase();
    var filtered = q ? items.filter(function (w) { return w.text.toLowerCase().indexOf(q) !== -1; }) : items;

    if (filtered.length === 0) { renderEmptySearch(search.trim()); return; }

    var active = filtered.filter(function (w) { return !w.done; })
      .slice().sort(function (a, b) { return a.text.localeCompare(b.text); });
    var done = filtered.filter(function (w) { return w.done; })
      .slice().sort(function (a, b) { return a.text.localeCompare(b.text); });

    els.listWrap.innerHTML = '';
    if (active.length) els.listWrap.appendChild(buildSection('Wishes', active));
    if (done.length) els.listWrap.appendChild(buildSection('Achieved', done));
  }

  els.listWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var row = btn.closest('.row');
    if (!row) return;
    var item = items.find(function (w) { return w.id === row.dataset.id; });
    if (!item) return;
    if (btn.dataset.action === 'toggle') toggleDone(item);
    else if (btn.dataset.action === 'delete') deleteWish(item);
    else if (btn.dataset.action === 'note') {
      editingNoteId = item.id;
      render();
    }
  });

  els.editBtn.addEventListener('click', function () {
    editMode = !editMode;
    render();
  });

  els.searchInput.addEventListener('input', function (e) {
    search = e.target.value;
    render();
  });

  els.addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var val = els.addInput.value;
    if (!val.trim()) return;
    addWish(val);
    els.addInput.value = '';
    els.addInput.focus();
  });

  els.addInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      if (els.addForm.requestSubmit) els.addForm.requestSubmit();
      else els.addForm.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });

  function showAppUi() {
    els.authPage.hidden = true;
    els.appPage.hidden = false;
  }
  function showAuthUi() {
    els.appPage.hidden = true;
    els.authPage.hidden = false;
  }

  function setAuthMode(signup) {
    authIsSignup = signup;
    els.authError.textContent = '';
    els.authName.hidden = !signup;
    els.authPassword.setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
    els.authSub.textContent = signup ? 'Create your account.' : 'Sign in to your list.';
    els.authSubmitBtn.textContent = signup ? 'Sign up' : 'Log in';
    els.authToggleBtn.textContent = signup ? 'Have an account? Log in' : 'Need an account? Sign up';
  }

  els.authToggleBtn.addEventListener('click', function () {
    setAuthMode(!authIsSignup);
  });

  els.authForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = els.authEmail.value.trim();
    var password = els.authPassword.value;
    var name = els.authName.value.trim();
    els.authError.textContent = '';
    els.authSubmitBtn.disabled = true;

    var done = function () { els.authSubmitBtn.disabled = false; };
    var fail = function (err) {
      done();
      els.authError.textContent = AUTH_ERROR_MESSAGES[err && err.code] || 'Something went wrong — try again.';
    };

    if (authIsSignup) {
      createUserWithEmailAndPassword(firebaseAuth, email, password)
        .then(function (cred) { return ensureOwnList(cred.user.uid, name, email); })
        .then(done)
        .catch(fail);
    } else {
      signInWithEmailAndPassword(firebaseAuth, email, password)
        .then(function (cred) { return ensureOwnList(cred.user.uid, null, email); })
        .then(done)
        .catch(fail);
    }
  });

  function ensureOwnList(uid, name, email) {
    var updates = {};
    updates['users/' + uid + '/email'] = email || null;
    if (name) updates['users/' + uid + '/name'] = name;
    updates['lists/' + uid + '/owner'] = uid;
    if (name) updates['lists/' + uid + '/ownerName'] = name;
    return update(ref(firebaseDb), updates);
  }

  function attachListListener(listId) {
    if (wishesUnsub) { wishesUnsub(); wishesUnsub = null; }
    activeListId = listId;
    items = [];
    loaded = false;
    editMode = false;
    editingNoteId = null;
    render();

    wishesRef = ref(firebaseDb, 'lists/' + listId + '/wishes');
    wishesUnsub = onValue(wishesRef, function (snapshot) {
      var val = snapshot.val() || {};
      items = Object.keys(val).map(function (id) {
        var data = val[id] || {};
        return {
          id: id,
          text: typeof data.text === 'string' ? data.text : '',
          done: !!data.done,
          createdAt: typeof data.createdAt === 'number' ? data.createdAt : 0,
          doneAt: typeof data.doneAt === 'number' ? data.doneAt : null,
          note: typeof data.note === 'string' ? data.note : null
        };
      });
      loaded = true;
      render();
      if (listId === currentUid) maybeOfferLegacyImport();
    }, function () {
      mode = 'local';
      items = localLoad();
      loaded = true;
      render();
    });
  }

  function refreshListSwitch() {
    var options = [{ id: currentUid, label: 'My List' }];
    sharedListIds.forEach(function (id) {
      options.push({ id: id, label: listNameCache[id] ? listNameCache[id] + '’s List' : 'Shared list' });
    });
    els.listSwitch.innerHTML = '';
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt.id;
      o.textContent = opt.label;
      if (opt.id === activeListId) o.selected = true;
      els.listSwitch.appendChild(o);
    });
    els.listSwitch.hidden = options.length <= 1;
  }

  function loadSharedLists() {
    get(ref(firebaseDb, 'users/' + currentUid + '/sharedLists')).then(function (snap) {
      var val = snap.val() || {};
      sharedListIds = Object.keys(val);
      if (!sharedListIds.length) { refreshListSwitch(); return; }
      var remaining = sharedListIds.length;
      sharedListIds.forEach(function (id) {
        get(ref(firebaseDb, 'lists/' + id + '/ownerName')).then(function (nameSnap) {
          listNameCache[id] = nameSnap.val() || null;
        }).catch(function () {}).then(function () {
          remaining -= 1;
          if (remaining === 0) refreshListSwitch();
        });
      });
    }).catch(function () { refreshListSwitch(); });
  }

  els.listSwitch.addEventListener('change', function () {
    var id = els.listSwitch.value;
    if (id && id !== activeListId) attachListListener(id);
  });

  function maybeOfferLegacyImport() {
    if (legacyImportChecked) return;
    legacyImportChecked = true;
    if (items.length > 0) return;
    get(ref(firebaseDb, 'wishes')).then(function (snap) {
      var val = snap.val();
      if (val && Object.keys(val).length) {
        legacyWishesCache = val;
        els.importBanner.hidden = false;
      }
    }).catch(function () {});
  }

  els.importDismissBtn.addEventListener('click', function () {
    els.importBanner.hidden = true;
  });

  els.importBtn.addEventListener('click', function () {
    if (!legacyWishesCache) return;
    els.importBtn.disabled = true;
    var ids = Object.keys(legacyWishesCache);
    var remaining = ids.length;
    ids.forEach(function (id) {
      var data = legacyWishesCache[id] || {};
      push(wishesRef, {
        text: typeof data.text === 'string' ? data.text : '',
        done: !!data.done,
        createdAt: typeof data.createdAt === 'number' ? data.createdAt : Date.now(),
        doneAt: typeof data.doneAt === 'number' ? data.doneAt : null,
        note: typeof data.note === 'string' ? data.note : null
      }).catch(function () {}).then(function () {
        remaining -= 1;
        if (remaining === 0) {
          els.importBtn.disabled = false;
          els.importBanner.hidden = true;
          legacyWishesCache = null;
          remove(ref(firebaseDb, 'wishes')).catch(function () {});
          showMessage('Imported your old list');
        }
      });
    });
  });

  els.shareOpenBtn.addEventListener('click', function () {
    els.myCodeBox.textContent = currentUid || '';
    els.joinCodeInput.value = '';
    els.joinError.textContent = '';
    els.shareOverlay.hidden = false;
  });
  els.shareCloseBtn.addEventListener('click', function () { els.shareOverlay.hidden = true; });
  els.shareOverlay.addEventListener('click', function (e) {
    if (e.target === els.shareOverlay) els.shareOverlay.hidden = true;
  });

  els.copyCodeBtn.addEventListener('click', function () {
    var code = els.myCodeBox.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () {
        showMessage('Code copied');
      }).catch(function () {});
    }
  });

  els.joinBtn.addEventListener('click', function () {
    var code = els.joinCodeInput.value.trim();
    els.joinError.textContent = '';
    if (!code) return;
    if (code === currentUid) { els.joinError.textContent = 'That’s your own code.'; return; }
    els.joinBtn.disabled = true;
    set(ref(firebaseDb, 'lists/' + code + '/members/' + currentUid), true)
      .then(function () {
        return update(ref(firebaseDb), { ['users/' + currentUid + '/sharedLists/' + code]: true });
      })
      .then(function () {
        els.joinBtn.disabled = false;
        els.shareOverlay.hidden = true;
        loadSharedLists();
        showMessage('Joined list');
      })
      .catch(function () {
        els.joinBtn.disabled = false;
        els.joinError.textContent = 'That code isn’t valid.';
      });
  });

  els.signOutBtn.addEventListener('click', function () {
    els.shareOverlay.hidden = true;
    signOut(firebaseAuth);
  });

  renderLoading();

  (function init() {
    try {
      var app = initializeApp(firebaseConfig);
      firebaseAuth = getAuth(app);
      firebaseDb = getDatabase(app);
    } catch (e) {
      mode = 'local';
      items = localLoad();
      loaded = true;
      showAppUi();
      els.shareOpenBtn.hidden = true;
      render();
      return;
    }

    setAuthMode(false);
    mode = 'firebase';

    onAuthStateChanged(firebaseAuth, function (user) {
      if (wishesUnsub) { wishesUnsub(); wishesUnsub = null; }
      if (!user) {
        currentUid = null;
        activeListId = null;
        sharedListIds = [];
        legacyImportChecked = false;
        els.importBanner.hidden = true;
        showAuthUi();
        return;
      }
      currentUid = user.uid;
      showAppUi();
      loadSharedLists();
      attachListListener(user.uid);
    });
  })();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
